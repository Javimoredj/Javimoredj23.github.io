<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAONYA | Digital Fashion Genesis</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #d199f7;
            --secondary-accent: #70e2ff;
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Malla de fondo sutil */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(209, 153, 247, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(209, 153, 247, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle, black, transparent 90%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 2s ease-out;
        }

        .coming-soon {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 30px;
            font-weight: 900;
            text-indent: 1.5rem;
            opacity: 0.7;
            animation: pulse 3s infinite alternate;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .logo-img {
            max-width: 340px;
            height: auto;
            filter: drop-shadow(0 0 40px rgba(209, 153, 247, 0.15));
            animation: float 6s ease-in-out infinite;
        }

        /* Sección de Marca y Moda */
        .brand-statement {
            margin-top: 40px;
        }

        .main-title {
            font-size: 1.2rem;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-statement {
            font-size: 0.8rem;
            color: #888;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
            letter-spacing: 0.05rem;
            font-weight: 300;
        }

        .status-footer {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .payment-pill {
            font-size: 0.6rem;
            color: var(--secondary-accent);
            border: 1px border-style: solid;
            border-color: rgba(112, 226, 255, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(112, 226, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 4px;
            height: 4px;
            background-color: var(--secondary-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--secondary-accent);
            animation: blink 1.5s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            from { opacity: 0.3; filter: blur(2px); }
            to { opacity: 0.8; filter: blur(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .logo-img { max-width: 260px; }
            .coming-soon { letter-spacing: 1rem; text-indent: 1rem; }
            .main-title { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="coming-soon">Próximamente</div>

        <div class="logo-container">
            <img src="logo.png" alt="MAONYA Logo" class="logo-img">
        </div>

        <div class="brand-statement">
            <h1 class="main-title">Alta Moda Digital</h1>
            <p class="sub-statement">
                Fusionando el diseño textil de vanguardia con la libertad financiera del futuro.
            </p>
        </div>

        <div class="status-footer">
            <div class="payment-pill">
                <span class="dot"></span>
                Ecosistema de Pagos Criptoactivos Nativo
            </div>
            
            <p style="font-size: 0.65rem; color: #444; text-transform: uppercase; letter-spacing: 2px;">
                Blockchain Deployment in progress
            </p>
        </div>
    </div>

</body>
</html>
